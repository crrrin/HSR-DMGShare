name: Tests
on: [push, pull_request]
jobs:
  tracker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy opencv-python-headless
      - run: python -m unittest discover -p 'test_*.py'
